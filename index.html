<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Euchre</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="wrap">

      <div id="scoreboard">
	<div class="st"><div class="sl">You &amp; North</div>
	  <div class="sv" id="score-us">0</div>
	  <div class="sk" id="tricks-us">0 tricks</div>
	</div>
	<div class="st"><div class="sl">East &amp; West</div>
	  <div class="sv" id="score-them">0</div>
	  <div class="sk" id="tricks-them">0 tricks</div>
	</div>
      </div>

      <div id="trump-display">
	<div class="pl">Trump</div>
	<div id="trump-suit">&#x2014;</div><div id="trump-hl"></div>
      </div>
      
      <div id="bid-display">
	<div class="pl">Contract</div>
	<div id="bid-info">&#x2014;</div>
      </div>

      <div id="top-bar">
	<button id="rules-btn" class="top-btn">Rules</button>
      </div>
      <div id="rules-modal" class="hidden rules-modal">
	<div class="rules-box">
          <button id="rules-close" class="close-btn">✖</button>
          <iframe id="rules-frame" src="rules.html"></iframe>
	</div>
      </div>
      


      <div class="pname" id="name-south">You</div>
      <div class="pname" id="name-north">North</div>
      <div class="pname" id="name-west">West</div>
      <div class="pname" id="name-east">East</div>

      <div class="hand" id="hand-south"></div>
      <div class="hand" id="hand-north"></div>
      <div class="hand" id="hand-west"></div>
      <div class="hand" id="hand-east"></div>

      <div id="trick-area">
	<div class="tslot" id="ts-south"></div>
	<div class="tslot" id="ts-north"></div>
	<div class="tslot" id="ts-west"></div>
	<div class="tslot" id="ts-east"></div>
      </div>

      <div class="speech hidden" id="sp-north" ></div>
      <div class="speech hidden" id="sp-west"  ></div>
      <div class="speech hidden" id="sp-east"  ></div>
      <div class="speech hidden" id="sp-south" ></div>

      <div id="trick-piles">
	<div class="tpile"><span class="tpc" id="pile-us">0</span>Your Team</div>
	<div class="tpile"><span class="tpc" id="pile-them">0</span>Opponents</div>
      </div>

      <div id="message" class="hidden"></div>
      <button id="play-btn" class="hidden">Play Selected Card</button>

      <!-- Start Screen -->
      <div id="start-screen">
	<div class="sbox">
	  <div class="stitle">♠ Bid Euchre ♥</div>
	  <div class="ssub">You & North vs. East &amp; West</div>
	  <button id="new-game-btn">New Game</button>
	</div>
      </div>

      <!-- Bid Modal -->
      <div id="bid-modal" class="overlay hidden">
	<div class="mbox">
	  <div class="mtitle" id="modal-title">Your Bid</div>
	  <div class="msub"   id="modal-sub">Choose a bid or pass</div>
	  <div id="bid-buttons"></div>
	  <div id="highlow-picker" style="display:none;"></div>

	  <div id="trump-picker"   style="display:none;"></div>
	  <div id="alone-picker" style="display:none;"></div>
	  <div id="card-req-picker" style="display:none;"></div>
	  
	</div>
      </div>

      <!-- Result -->
      <div id="result-overlay" class="overlay hidden">
	<div class="rbox">
	  <div class="rtitle"  id="result-title">Hand Complete</div>
	  <div class="rdetail" id="result-detail"></div>
	  <div class="rscores">
            <div class="rsi"><div class="rsit">You &amp; North</div>
	      <div class="rsin" id="result-us">0</div>
	    </div>
            <div class="rsi"><div class="rsit">East &amp; West</div>
	      <div class="rsin" id="result-them">0</div>
	    </div>
	  </div>
	  <button id="deal-again-btn">Deal Next Hand</button>
	</div>
      </div>

    </div>

    <div id="starter-graphic" class="hidden"></div>
<!--
    <div id="starter-spinner" class="hidden">
      <div class="spinner-ring"></div>
      <div class="spinner-text">Randomly picking starting player…</div>
    </div>
    -->

    <div id="starter-spinner" class="hidden">
    <div class="spinner-ring">
        <div class="spinner-label north">N</div>
        <div class="spinner-label east">E</div>
        <div class="spinner-label south">S</div>
        <div class="spinner-label west">W</div>
    </div>
    <div class="spinner-text">Randomly picking starting player…</div>
</div>

    <script src="utils.js"></script>
    <script src="render.js"></script>
    <script src="grinbideuchre.js"></script>
    <script src="bidding.js"></script>
    <script src="play.js"></script>


  </body>
</html>
