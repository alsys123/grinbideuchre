<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Euchre</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="info.css">
  </head>
  <body>
    <div id="wrap">
      
      <div id="northBackdoor"
	   style="
		  position:absolute;
		  top:0;
		  left:0;
		  width:40px;
		  height:40px;
		  opacity:0;
		  z-index:9999;
		  cursor:pointer;
		  ">
      </div>
<!-- Visible star (does NOT block clicks) -->
<div style="
     position:absolute;
     top:0;
     left:0;
     width:40px;
     height:40px;
     display:flex;
     align-items:center;
     justify-content:center;
     pointer-events:none;   /* star stays click‑through */
     z-index:9998;          /* or 10000 if needed */
">
    <span style="color:var(--gold); font-size:18px;">★</span>
</div>
      
      <div id="scoreboard">
	<div class="st"><div class="sl">You &amp; North</div>
	  <div class="sv" id="score-us">0</div>
	  <div class="hidden sk" id="tricks-us">0 tricks</div>
	</div>
	<div class="st"><div class="sl">East &amp; West</div>
	  <div class="sv" id="score-them">0</div>
	  <div class="hidden sk" id="tricks-them">0 tricks</div>
	</div>
      </div>

      
      <!-- Deterministic deal display and select -->
      <div id="DealBackdoor"
	   style="
		  position:absolute;
		  top:0;
		  left:25%;
		  width:40px;
		  height:40px;
		  opacity:0;
		  z-index:9999;
		  cursor:pointer;
		  ">
      </div>
      
      <!-- Visible star (does NOT block clicks) -->
      <div style="
		  position:absolute;
		  top:0;
		  left:25%;
		  width:40px;
		  height:40px;
		  display:flex;
		  align-items:center;
		  justify-content:center;
		  pointer-events:none;   /* star stays click‑through */
		  z-index:9998;          /* or 10000 if needed */
		  ">
	<span style="color:var(--gold); font-size:18px;">★</span>
      </div>
      
      
      <div id="deal-number"
	   style="font-size:11px;
		  color:var(--gold);
		  letter-spacing:1px;
		  cursor:pointer;
		  margin-top: 50px;
		  margin-left: 75%;
		  display:none;
		  "
	   title="Click to copy deal number"
	   onclick="copyDealNumber(); ">
      </div>

      <div id="replay-box"
	   style="display:none;
		  gap:6px;
		  margin-top:10px;
		  margin-left: 75%;
		  align-items:center;">
	
	<input id="replay-input" type="text"
               placeholder="047-82341-067459821"
               style="font-family:Georgia,serif;
                      font-size:13px;
                      background:rgba(0,0,0,0.5);
                      color:var(--cream);
                      border:1px solid var(--gold-dark);
                      border-radius:2px;
                      padding:1px 2px;
		      margin-top: 20px;
		      width:fit-content;
		      max-width:fit-content;
		      box-sizing:content-box;
		      display:inline-block;">
	
	<button onclick="replayDeal(document.getElementById('replay-input').value)"
		class="abtn"
		style="padding:2px 6px; font-size:12px;" >
	  Go
	</button>
	
      </div>

      <!--- END OF ... Deterministic deal display and select  -->
      
      <div id="details-modal" class="hidden details-modal">
	<div class="details-box">
	  <div class="details-title">Game Details</div>
	  <div id="details-body"></div>
	  <button id="details-close">Close</button>
	</div>
      </div>

      <div id="history-modal" class="hidden details-modal">
	<div class="details-box">
	  <div class="details-title">Game History</div>
	  <div id="history-body" class="history-scroll"></div>
	  <button id="history-close">Close</button>
	</div>
      </div>

      <!-- hide trump display - eventually remove it -->
      <div id="hidden trump-display">
	<div class="hidden pl">Trump</div>
	<div id="trump-suit" class="hidden" >&#x2014;</div>
	<div id="trump-hl" class="hidden" ></div>
      </div>

      <div id="bid-display">
	<div class="pl">Contract</div>
	<div id="bid-info">&#x2014;</div>
      </div>

      <div id="top-bar">
<!--	<button id="rules-btn" class="top-btn">
	  Info
	</button> -->
	<button id="info-btn" class="top-btn">Info</button>

	<button id="concedeBtn" style="
				       position:absolute;
				       top:10px;
				       right:130px;
				       padding:6px 12px;
				       font-size:14px;
				       cursor:pointer;
				       border-radius:6px;
				       background:#c33;
				       color:white;
				       border:none;
				       display:none;
				       ">
	  Concede
	</button>

      </div>
<!--      
      <div id="rules-modal" class="hidden rules-modal">
	<div class="rules-box">
          <button id="rules-close" class="close-btn">✖</button>
          <iframe id="rules-frame" src="info.html"></iframe>
	</div>
      </div>
      -->
      
      <div id="info-modal" class="hidden modal-overlay">
	<div class="info-box">
	  <button id="info-close" class="close-btn">✖</button>
	  
	  <div id="info-content" class="info-content">
	    <!-- JS will inject sections here -->
	  </div>
	</div>
      </div>
      

      <div class="pname" id="name-south">You</div>
      <div class="pname" id="name-north">North</div>
      <div class="pname" id="name-west">West</div>
      <div class="pname" id="name-east">East</div>

      <div class="hand" id="hand-south"></div>
      <div class="hand" id="hand-north"></div>
      <div class="hand" id="hand-west"></div>
      <div class="hand" id="hand-east"></div>

      <div id="trick-area">
	<div class="tslot" id="ts-south"></div>
	<div class="tslot" id="ts-north"></div>
	<div class="tslot" id="ts-west"></div>
	<div class="tslot" id="ts-east"></div>
      </div>

      <div class="speech hidden" id="sp-north" ></div>
      <div class="speech hidden" id="sp-west"  ></div>
      <div class="speech hidden" id="sp-east"  ></div>
      <div class="speech hidden" id="sp-south" ></div>

      <div id="trick-piles">
	<div class="tpile"><span class="tpc" id="pile-us">0</span>Your Team</div>
	<div class="tpile"><span class="tpc" id="pile-them">0</span>Opponents</div>
      </div>

      <div id="message" class="hidden"></div>
      <button id="play-btn" class="hidden">Play Selected Card</button>

      <!-- Start Screen -->
      <div id="start-screen">
	<div class="sbox">
	  <div class="stitle">♠ Bid Euchre ♥</div>
	  <div class="ssub">You & North vs. East &amp; West</div>
	  <button id="new-game-btn">New Game</button>
	</div>
      </div>

      <!-- Bid Modal -->
      <div id="bid-modal" class="overlay hidden">
	<div class="mbox">
	  <div class="mtitle" id="modal-title">Your Bid</div>
	  <div class="msub"   id="modal-sub">Choose a bid or pass</div>
	  <div id="bid-buttons"></div>
	  <div id="highlow-picker" style="display:none;"></div>

	  <div id="trump-picker"   style="display:none;"></div>
	  <div id="alone-picker" style="display:none;"></div>
	  <div id="card-req-picker" style="display:none;"></div>
	  
	</div>
      </div>

      <!-- Result -->
      <div id="result-overlay" class="overlay hidden">
	<div class="rbox">
	  <div class="rtitle"  id="result-title">Hand Complete</div>
	  <div class="rdetail" id="result-detail"></div>
	  <div class="rscores">
            <div class="rsi"><div class="rsit">You &amp; North</div>
	      <div class="rsin" id="result-us">0</div>
	    </div>
            <div class="rsi"><div class="rsit">East &amp; West</div>
	      <div class="rsin" id="result-them">0</div>
	    </div>
	  </div>
	  <button id="deal-again-btn">Deal Next Hand</button>
	  <button id="play-again-btn" class="abtn hidden">Play Again</button>
	  <button id="showScoreBoardHistory-btn" class="abtn">Show Score</button>

	</div>
      </div>

    </div>

    <div id="starter-graphic" class="hidden"></div>

    <div id="starter-spinner" class="hidden">
      <div class="spinner-ring">
        <div class="spinner-label north">N</div>
        <div class="spinner-label east">E</div>
        <div class="spinner-label south">S</div>
        <div class="spinner-label west">W</div>
      </div>

      <!--     <div class="spinner-text">Randomly picking the dealer</div> -->

    </div>

    <script src="utils.js"></script>

    <!--    <script src="info.js"></script> -->
    <script src="info-v2.js"></script>
    <script src="exchangev2.js"></script>
    <script src="render.js?v=100"></script>
    <script src="grinbideuchre.js"></script>
    <script src="bidding.js"></script>
    <script src="aiBidV2.js"></script>
    <script src="play.js"></script>
    <script src="responsiveScale.js"></script>
    <script src="backdoor.js"></script>
    


  </body>
</html>
